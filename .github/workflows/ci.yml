name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  simulator-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Lint simulator and isolated test runner
        run: ruff check infra/digitalocean-shadow/ scripts/test_simulator_isolated.py
      - name: Verify shared M2 M5 ledger without external network or credentials
        run: python scripts/test_simulator_isolated.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest --cov=src --cov-report=term-missing

      - name: Type check with mypy (no fail)
        run: mypy src/ || true
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kalshi-bot:test .

      - name: Verify image runs
        run: |
          docker run --rm kalshi-bot:test python -c "from src.utils.config import Settings; print('Import OK')"
