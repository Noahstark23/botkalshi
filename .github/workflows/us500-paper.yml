name: US500 paper (offline)

on:
  push:
    branches: [main, develop, codex/us500-paper-v1-20261011]
    paths: ['research/us500/**', 'research/US500_REVIEW.md', '.github/workflows/us500-paper.yml']
  pull_request:
    paths: ['research/us500/**', '.github/workflows/us500-paper.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: research/us500
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lint tool
        run: python -m pip install ruff==0.14.0
      - name: Verify current package
        run: python verify_package.py
      - name: Lint and format
        run: |
          ruff check --isolated --select E,F,I --ignore E501 .
          ruff format --isolated --check .
      - name: Offline suite and restart smoke
        run: python verify_offline.py
