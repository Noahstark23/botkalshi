# =====================================================
# docker-compose.yml para Coolify deployment
#
# Coolify lee este archivo automáticamente. Las env vars vienen
# del panel de Coolify, no del .env (excepto en local dev).
# =====================================================

services:
  kalshi-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalshi-bot
    restart: unless-stopped
    # Margen para shutdown limpio (alert_shutdown + cierre de DB/WS) antes del SIGKILL.
    # Default Docker = 10s; lo subimos para que el SIGTERM del redeploy cierre ordenado.
    stop_grace_period: 30s

    # Variables de entorno - Coolify las inyecta desde su panel
    # En .env vacíos por default para que Coolify las defina
    environment:
      KALSHI_ENV: ${KALSHI_ENV:-demo}
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID}
      # La clave se monta por Coolify (Storages → file mount) en /app/secrets — NUNCA
      # viaja en la imagen (incidente 2026-08-19: el PEM estuvo versionado en repo público).
      KALSHI_PRIVATE_KEY_PATH: ${KALSHI_PRIVATE_KEY_PATH:-/app/secrets/kalshi_private_key.pem}
      # VÍA PRINCIPAL de entrega de la clave (incidente 2026-08-20): en una app COMPOSE
      # de Coolify los file mounts del panel se IGNORAN y el volumen que la UI ofrece no
      # existe en el host → no hay forma de poner un archivo en /app/secrets. Pegar acá
      # el contenido del .pem (saltos reales, `\n` literal o base64: los tres andan).
      # Si está seteada, GANA sobre KALSHI_PRIVATE_KEY_PATH.
      KALSHI_PRIVATE_KEY: ${KALSHI_PRIVATE_KEY:-}
      DATABASE_URL: sqlite:////app/data/trades.db

      # Risk management
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-3.0}
      MAX_WEEKLY_LOSS_PCT: ${MAX_WEEKLY_LOSS_PCT:-8.0}
      MAX_MONTHLY_LOSS_PCT: ${MAX_MONTHLY_LOSS_PCT:-15.0}
      MAX_SIMULTANEOUS_EXPOSURE_PCT: ${MAX_SIMULTANEOUS_EXPOSURE_PCT:-25.0}
      MAX_TRADE_SIZE_PCT: ${MAX_TRADE_SIZE_PCT:-5.0}
      KELLY_FRACTION: ${KELLY_FRACTION:-0.25}
      MIN_EDGE_PCT: ${MIN_EDGE_PCT:-2.0}
      MIN_LIQUIDITY_CONTRACTS: ${MIN_LIQUIDITY_CONTRACTS:-10}

      # Capital
      ACTIVE_CAPITAL_USD: ${ACTIVE_CAPITAL_USD:-300.00}

      # Telegram (opcional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      # Health server
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Operational toggles - default todo OFF
      TRADING_ENABLED: ${TRADING_ENABLED:-false}
      MOTOR_1_ARBITRAGE_ENABLED: ${MOTOR_1_ARBITRAGE_ENABLED:-false}
      MOTOR_1_EXECUTION_ENABLED: ${MOTOR_1_EXECUTION_ENABLED:-false}
      MOTOR_2_SPORTSBOOK_ENABLED: ${MOTOR_2_SPORTSBOOK_ENABLED:-false}
      MOTOR_2_ENTRY_EXECUTION_ENABLED: ${MOTOR_2_ENTRY_EXECUTION_ENABLED:-false}
      MOTOR_2_EXECUTION_ENABLED: ${MOTOR_2_EXECUTION_ENABLED:-false}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_API_SPORT_KEYS: ${ODDS_API_SPORT_KEYS:-baseball_mlb}
      ODDS_API_REGIONS: ${ODDS_API_REGIONS:-us}
      ODDS_API_CACHE_TTL_SEC: ${ODDS_API_CACHE_TTL_SEC:-60}
      MOTOR2_SERIES: ${MOTOR2_SERIES:-KXMLBGAME}
      DISCOVERY_EXTRA_SERIES: ${DISCOVERY_EXTRA_SERIES:-}
      MOTOR_2_MIN_BOOKS: ${MOTOR_2_MIN_BOOKS:-3}
      MOTOR_2_MAX_BOOK_AGE_MIN: ${MOTOR_2_MAX_BOOK_AGE_MIN:-15}
      MOTOR_2_BURST_INTERVAL_SEC: ${MOTOR_2_BURST_INTERVAL_SEC:-0}
      MOTOR_2_BURST_WINDOW_MIN: ${MOTOR_2_BURST_WINDOW_MIN:-45}
      # Filtro underdog Motor 2 (FASE 3). ENABLED off = shadow (loguea lo que bloquearía pero
      # igual entra); on = bloquea entradas <MIN_ENTRY_CENTS (sangraron −$110,77 históricos).
      MOTOR_2_MIN_ENTRY_CENTS: ${MOTOR_2_MIN_ENTRY_CENTS:-40}
      MOTOR_2_UNDERDOG_FILTER_ENABLED: ${MOTOR_2_UNDERDOG_FILTER_ENABLED:-false}
      MOTOR_3_CLV_ENABLED: ${MOTOR_3_CLV_ENABLED:-false}
      # Ejecución de Motor 3 desacoplada del trading global (consenso de 2 flags). En false
      # corre en SHADOW aunque TRADING_ENABLED=true → se valida sin vender de verdad.
      MOTOR_3_EXECUTION_ENABLED: ${MOTOR_3_EXECUTION_ENABLED:-false}
      # Take-profit por precio (FASE 1). ENABLED gatea detección+log; la venta sigue gateada
      # por MOTOR_3_EXECUTION_ENABLED. Shadow = TAKE_PROFIT_ENABLED=true + EXECUTION=false.
      MOTOR_3_TAKE_PROFIT_ENABLED: ${MOTOR_3_TAKE_PROFIT_ENABLED:-false}
      MOTOR_3_TAKE_PROFIT_CENTS: ${MOTOR_3_TAKE_PROFIT_CENTS:-90}
      # Trailing stop (FASE 2). ENABLED gatea detección+log; la venta sigue gateada por
      # MOTOR_3_EXECUTION_ENABLED. DROP = retroceso en cents desde el pico del bid.
      MOTOR_3_TRAILING_ENABLED: ${MOTOR_3_TRAILING_ENABLED:-false}
      MOTOR_3_TRAILING_DROP_CENTS: ${MOTOR_3_TRAILING_DROP_CENTS:-5}
      USE_ORDERBOOK_MANAGER_V2: ${USE_ORDERBOOK_MANAGER_V2:-false}

      # Motor 5 F1-v2. Ejecución permanece OFF; estos flags solo producen telemetría.
      MOTOR_MM_ENABLED: ${MOTOR_MM_ENABLED:-false}
      MOTOR_MM_EXECUTION_ENABLED: ${MOTOR_MM_EXECUTION_ENABLED:-false}
      MOTOR_MM_SERIES: ${MOTOR_MM_SERIES:-KXMLBGAME}
      MOTOR_MM_EXPERIMENT_ID: ${MOTOR_MM_EXPERIMENT_ID:-m5-f1c-2026-08-22-mlb}
      MOTOR_MM_MAX_TICKERS: ${MOTOR_MM_MAX_TICKERS:-5}
      MOTOR_MM_HALF_SPREAD_CENTS: ${MOTOR_MM_HALF_SPREAD_CENTS:-5}
      MOTOR_MM_QUOTE_SIZE_CONTRACTS: ${MOTOR_MM_QUOTE_SIZE_CONTRACTS:-1}
      MOTOR_MM_MAX_INVENTORY_CONTRACTS: ${MOTOR_MM_MAX_INVENTORY_CONTRACTS:-5}
      MOTOR_MM_EDGE_SKEW_CENTS: ${MOTOR_MM_EDGE_SKEW_CENTS:-0}
      MOTOR_MM_FAIR_TTL_SEC: ${MOTOR_MM_FAIR_TTL_SEC:-360}
      MOTOR_MM_REQUIRE_PREGAME: ${MOTOR_MM_REQUIRE_PREGAME:-true}
      MOTOR_MM_KICKOFF_BUFFER_SEC: ${MOTOR_MM_KICKOFF_BUFFER_SEC:-120}
      MOTOR_MM_MAX_EXPOSURE_USD: ${MOTOR_MM_MAX_EXPOSURE_USD:-5}
      MOTOR_MM_FEES_AS_MAKER: ${MOTOR_MM_FEES_AS_MAKER:-true}
      MOTOR_MM_JUMP_RETREAT_CENTS: ${MOTOR_MM_JUMP_RETREAT_CENTS:-5}
      MOTOR_MM_F3_ACK: ${MOTOR_MM_F3_ACK:-}

      # Motor REST (shadow/live). MOTOR_REST_ENABLED=true + TRADING_ENABLED=false = shadow.
      MOTOR_REST_ENABLED: ${MOTOR_REST_ENABLED:-false}
      # Ejecución de Motor REST desacoplada del trading global (consenso de 2 flags). En
      # false corre en SHADOW (detecta + log de intención hard-first) aunque TRADING_ENABLED
      # =true → se valida el guardarraíl sin ejecutar ni apagar a Motor 2.
      MOTOR_REST_EXECUTION_ENABLED: ${MOTOR_REST_EXECUTION_ENABLED:-false}
      MOTOR_REST_MIN_EDGE_CENTS: ${MOTOR_REST_MIN_EDGE_CENTS:-1}
      MOTOR_REST_MIN_DEPTH: ${MOTOR_REST_MIN_DEPTH:-2}
      # Umbral FINO de ejecución (% del capital comprometido); calibrable desde Coolify.
      MOTOR_REST_EXECUTION_EDGE_PCT: ${MOTOR_REST_EXECUTION_EDGE_PCT:-1.5}

      # Reportes (advisory-only, no tradean)
      DAILY_PNL_REPORT_ENABLED: ${DAILY_PNL_REPORT_ENABLED:-false}

      # Optional
      SENTRY_DSN: ${SENTRY_DSN:-}

    volumes:
      # Persistencia entre re-deploys
      - kalshi_data:/app/data
      - kalshi_logs:/app/logs
      # Respaldo manual de la clave: nace VACÍO, así que no reemplaza a KALSHI_PRIVATE_KEY
      # — solo habilita meterla por `docker cp` si alguna vez hace falta un archivo.
      - kalshi_secrets:/app/secrets

    ports:
      # Health endpoint
      - "18080:8080"

    # Resource limits para no joder otros servicios del VPS
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

    # Healthcheck nativo Docker (además del de Dockerfile)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    # Logging - Coolify captura stdout
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =====================================================
# Volumes - Coolify los gestiona automáticamente
# =====================================================
volumes:
  kalshi_data:
    driver: local
  kalshi_logs:
    driver: local
  kalshi_secrets:
    driver: local
