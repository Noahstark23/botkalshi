[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Algorithmic trading bot for Kalshi prediction markets"
requires-python = ">=3.12"
authors = [{name = "Noel Pineda"}]
license = {text = "Proprietary"}

dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0,<17.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.16",
    "cryptography>=42.0.0",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.0",
    "loguru>=0.7.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "freezegun>=1.5.0",
    # Mutation testing de los money paths (2026-08-05): mide si los tests MUERDEN.
    # Solo dev/manual (scripts/mutacion_money_paths.sh) — jamás en el hot path de CI:
    # corre la suite una vez POR MUTANTE.
    "mutmut>=2.5,<3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]  # line length, handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.*",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
